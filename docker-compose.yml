version: "3.9"

services:
  web:
    build: .
    container_name: kartu_soal_app
    ports:
      - "4321:5000"
    environment:
      - TZ=Asia/Jakarta
    env_file:
      - .env
    volumes:
      # Persist DB SQLite & file uploads ke host
      - ./instance:/app/instance
      - ./static/uploads:/app/static/uploads
    restart: unless-stopped