{% extends 'base.html' %}
{% block title %}Aktivasi Akun{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-2">Aktivasi Akun — Login Pertama</h4>
        <p class="text-muted">Silakan isi email aktif, nomor WhatsApp, dan password baru Anda.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email Aktif</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nomor WhatsApp (Aktif)</label>
            <input type="tel" name="phone" class="form-control" placeholder="Contoh: 08123456789" required>
            <small class="text-muted">Pastikan nomor aktif untuk menerima notifikasi.</small>
          </div>
          <div class="mb-3">
            <label class="form-label">Password Baru</label>
            <input type="password" name="new_password" class="form-control" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label">Konfirmasi Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100">Simpan & Lanjutkan</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
